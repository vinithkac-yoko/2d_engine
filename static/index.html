<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamly2D AI Assistant</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- Header -->
<div id="header">
  <div>
    <h1>Seamly2D AI Assistant</h1>
    <div class="subtitle">AI-powered sewing pattern design</div>
  </div>
  <div id="status-badge">○ Connecting...</div>
</div>

<!-- Main app -->
<div id="app">

  <!-- Chat panel -->
  <div id="chat-panel">

    <!-- Upload area -->
    <div id="upload-area">
      <label id="upload-label" for="file-input">
        ↑ Drop .val pattern file here (or click to browse)
        <br><small>Also accepts .vit measurements, images, PDFs</small>
      </label>
      <input type="file" id="file-input" multiple
             accept=".val,.vit,.png,.jpg,.jpeg,.webp,.pdf">
      <div id="upload-status">No pattern loaded</div>
    </div>

    <!-- Pending attachments -->
    <div id="attachment-preview"></div>

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Input -->
    <div id="input-area">
      <textarea id="msg-input" placeholder="Describe a pattern change…&#10;e.g. 'Add a 15cm pocket on the side seam'" rows="2"></textarea>
      <button id="send-btn">Send</button>
    </div>

  </div>

  <!-- Preview panel -->
  <div id="preview-panel">
    <div id="preview-toolbar">
      <span>Pattern Preview</span>
      <button class="toolbar-btn" id="zoom-out">− Zoom</button>
      <span id="zoom-level">100%</span>
      <button class="toolbar-btn" id="zoom-in">+ Zoom</button>
      <button class="toolbar-btn" id="zoom-reset">Reset</button>
      <button class="toolbar-btn" id="download-btn">⬇ Download .val</button>
    </div>

    <div id="preview-container">
      <div id="svg-container" style="display:none;"></div>
      <div id="empty-state">
        <div class="icon">✂️</div>
        <p>No pattern loaded</p>
        <small>Upload a .val file to see the pattern preview</small>
      </div>
    </div>
  </div>

</div>

<!-- Scripts -->
<script src="/js/upload.js"></script>
<script src="/js/preview.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
